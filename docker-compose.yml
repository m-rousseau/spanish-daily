# Runs the site on the home server. Secrets live in .env.production (never committed).
services:
  web:
    build: .
    image: espanol-diario:latest
    container_name: espanol-diario
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}" # same user that owns ./data and the key file
    env_file: .env.production
    environment:
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/google-key.json
    ports:
      - "127.0.0.1:3070:3000" # only reachable on the server itself; Tailscale Funnel publishes it
    volumes:
      - ./data:/app/.data # progress, exams, chats (per user JSON files)
      - ./google-key.json:/run/secrets/google-key.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m" # rotate logs: at most 5 × 10 MB kept
        max-file: "5"
